name: Build 4K store images

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_4k_images.py'
      - '.github/workflows/build-4k-images.yml'
      - 'game-covers/*.png'
      - 'game-covers/*.jpg'
      - 'game-covers/*.jpeg'
      - 'game-covers/*.webp'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-4k-images
  cancel-in-progress: false

jobs:
  image-masters:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate 4K and mobile WebP image variants
        run: python scripts/build_4k_images.py
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-covers/4k game-covers/mobile
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Build responsive 4K WebP store image assets"
          git push
