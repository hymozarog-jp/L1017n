name: Reorder home layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  reorder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update home layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          start = s.find('<section class="hero" id="homeView">')
          if start != -1:
              end = s.find('</section>', start)
              if end != -1:
                  s = s[:start] + s[end + len('</section>'):]
          s = s.replace('<section class="stats">', '<section class="stats home-stats">', 1)
          s = s.replace('<section class="wallet-promo">', '<section class="wallet-promo home-balance">', 1)
          s = s.replace('رصيدك، تحت سيطرتك.', 'رصيدك الحالي', 1)
          s = s.replace('اشحن عبر ليبيانا أو المدار، وقدّم طلب الشحن وتابع حالته من صفحة طلباتي.', 'رصيد محفظتك وشحنها متاحين من قسم المحفظة.', 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Simplify home layout and move balance below cards"
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/reorder-home.yml || true
          git commit -m "Remove one-time home layout workflow" || true
          git push || true
