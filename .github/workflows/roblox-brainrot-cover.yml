name: Fetch official Roblox Steal a Brainrot cover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/roblox-brainrot-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the official game icon from Roblox
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request
          api="https://thumbnails.roblox.com/v1/games/icons?universeIds=7709344486&size=512x512&format=Png&isCircular=false"
          request=urllib.request.Request(api,headers={"User-Agent":"Mozilla/5.0 (compatible; L1017nCoverSync/1.0)"})
          with urllib.request.urlopen(request,timeout=25) as response:
              payload=json.load(response)
          item=(payload.get("data") or [None])[0]
          url=item and item.get("imageUrl","")
          if not url.startswith("https://tr.rbxcdn.com/") or item.get("state")!="Completed":
              raise RuntimeError("Roblox has not returned a completed official game icon")
          request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(request,timeout=25) as response:
              content=response.read(6_000_000)
          if not content.startswith(b"\x89PNG\r\n\x1a\n"):
              raise RuntimeError("Expected a PNG image from Roblox")
          path=pathlib.Path("game-covers/steal-a-brainrot-original.png")
          path.write_bytes(content)
          print("Official Roblox game icon downloaded:",len(content),"bytes")
          PY
      - name: Commit official image to site assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-covers/steal-a-brainrot-original.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add official Steal a Brainrot Roblox game icon"
          git push
