name: Validate Roblox Steal a Brainrot section
on:
  push:
    branches: [main]
    paths:
      - 'brainrot-store.js'
      - 'brainrot-store.css'
      - 'store-menu.js'
      - 'legacy-app.js'
      - 'app.js'
      - 'index.html'
      - '.github/workflows/validate-brainrot.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check brainrot-store.js
          node --check store-menu.js
          node --check legacy-app.js
          node --check app.js
      - name: Verify Roblox category and secure checkout integration
        run: |
          node - <<'JS'
          const fs=require('fs'), assert=require('assert').strict;
          const menu=fs.readFileSync('store-menu.js','utf8');
          const browser=fs.readFileSync('brainrot-store.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const old=fs.readFileSync('legacy-app.js','utf8');
          const css=fs.readFileSync('brainrot-store.css','utf8');
          for(const name of ['قرما','لاسيكرت','لاسبوكي'])assert(browser.includes(name),'Missing character '+name);
          assert(menu.includes('data-rgp-choice="brainrot"'));
          assert(menu.includes('window.openStealBrainrotCategory()'));
          assert(browser.includes('openInsideRoblox'));
          assert(browser.includes('7709344486'));
          assert(browser.includes('https://www.roblox.com/games/109983668079237/Steal-a-Brainrot'));
          assert(browser.includes('create_purchase_order'));
          assert(browser.includes('ensurePurchasePhone'));
          assert(browser.includes('product&&product.active&&Number(product.price)>0'));
          assert(old.includes('steal-a-brainrot'));
          assert(/brainrot-store\.js\?v=steal-inner\d+/.test(html));
          assert(/brainrot-store\.css\?v=[^"']+/.test(html));
          assert(css.includes('.rgp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}'), 'All three Roblox cards should share equal-width grid cells');
          assert(!css.includes('grid-column:span 2'), 'Steal card must not span columns on mobile');
          assert(!css.includes('grid-template-columns:42% 58%'), 'Steal card should use standard vertical layout');
          assert(menu.includes('.rgp-card:not(.mm2):not(.steal) img'), 'Steal cover should render full bleed like MM2');
          assert(css.includes('.sab-products-grid'));
          // Each inner page has one common back button and no duplicate hero.
          assert(menu.includes('setInnerHeader(p,\'MM2\',\'mm2\')'),'MM2 must use the shared compact header');
          assert(browser.includes('window.setRobloxInnerHeader(root,"ماب السرقة","brainrot")'),'Brainrot must use the shared header');
          assert(menu.includes('rgp-inner-page .rgp-hero'),'Hide oversized Roblox hero on subcategories');
          assert(menu.includes('root.scrollTop=0'),'Scroll to the top on navigation');
          assert(!menu.includes('data-mm2-back'),'Remove duplicate MM2 back control');
          assert(!browser.includes('data-sab-back'),'Remove duplicate Brainrot back control');
          assert(!menu.includes('روبلوكس ← باقة MM2'),'No breadcrumb arrows in MM2 page title');
          assert(!browser.includes('روبلوكس ← ماب السرقة'),'No breadcrumb arrows in Brainrot page title');
          assert(menu.includes('if(p.classList.contains(\'rgp-inner-page\'))showRobloxPage()'),'Back from inner page returns to Roblox categories');
          assert(html.includes('store-menu.js?v=inner-layout6'),'Fresh Roblox menu asset version');
          assert(html.includes('brainrot-store.css?v=inner-layout5'),'Fresh layout stylesheet');
          assert(fs.existsSync('game-covers/steal-a-brainrot-original.png'), 'Original Roblox icon is missing');
          console.log('Roblox Steal a Brainrot inner category verified.');
          JS
