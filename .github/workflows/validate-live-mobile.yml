name: Validate current mobile storefront categories
on:
  push:
    branches: [main]
    paths:
      - 'live-mobile.js'
      - 'live-mobile.css'
      - 'index.html'
      - '.github/workflows/validate-live-mobile.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current mobile navigation and real checkout integration
        run: |
          node --check live-mobile.js
          node --check premium-home.js
          node --check store-menu.js
          node --check legacy-app.js
          node --check instant-code.js
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('live-mobile.js','utf8');
          const css=fs.readFileSync('live-mobile.css','utf8');
          const old=fs.readFileSync('legacy-app.js','utf8');
          assert.match(html,/href="live-mobile\.css\?v=/);
          assert.match(html,/src="live-mobile\.js\?v=/);
          assert.equal((html.match(/src="live-mobile\.js/g)||[]).length,1);
          for(const key of ['roblox','mm2','steal-a-brainrot']){
            assert(js.includes('key:"'+key+'"'),'Active shop section missing: '+key);
          }
          for(const handler of ['openRobuxPackages','openMm2StoreCategory','openBrainrotStoreCategory']){
            assert(js.includes('window.'+handler),'Game must use real category handler: '+handler);
          }
          assert(js.includes('const SHOP_SECTIONS = ['));
          assert(js.includes('SHOP_SECTIONS.filter(matchesSection)'));
          assert(js.includes("q(\"#llCatalog\")"));
          assert(js.includes('data-ll-game'));
          assert(js.includes('function routeView(view)'));
          assert(js.includes('switchView(view)'));
          assert(js.includes('data-ll-nav'));
          assert(js.includes('routeView(btn.dataset.llNav)'));
          assert(old.includes("leaderboard:['#leaderboardView']"));
          assert(js.includes('new IntersectionObserver'));
          assert(js.includes('new MutationObserver'));
          assert(css.includes('prefers-reduced-motion'));
          assert(css.includes('backdrop-filter'));
          assert(html.includes('id="googleProfileButton"'));
          assert(!/\.rpc\(|wallet_accounts.*update|demoBuy\(/.test(js),
            'Landing page must not directly modify balances or bypass checkout');
          console.log('Active mobile categories, real navigation and checkout boundaries verified');
          JS
