name: Validate premium personal account design
on:
  push:
    branches: [main]
    paths:
      - 'personal-premium.js'
      - 'personal-premium.css'
      - 'legacy-app.js'
      - 'phone-verification-page.js'
      - 'index.html'
      - 'app.js'
      - '.github/workflows/validate-premium-profile.yml'
  workflow_dispatch:
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authenticated account data, real phone badge and visual markup
        run: |
          node --check personal-premium.js
          node --check phone-verification-page.js
          node --check legacy-app.js
          node --check app.js
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const logic=fs.readFileSync('personal-premium.js','utf8');
          const css=fs.readFileSync('personal-premium.css','utf8');
          const legacy=fs.readFileSync('legacy-app.js','utf8');
          const phone=fs.readFileSync('phone-verification-page.js','utf8');
          const app=fs.readFileSync('app.js','utf8');
          assert(html.includes('personal-premium.js?v=profile-glow2'));
          assert(html.includes('personal-premium.css?v=profile-glow2'));
          assert.match(html,/app\.js\?v=[A-Za-z0-9._-]+/,'Versioned site app loader must be present');
          assert(/legacy-app\\.js\\?v=[^"'\\s]+/.test(app));
          assert(html.includes('phone-verification-page.js?v=profile-glow2'));
          assert(legacy.includes('L1017nPersonalPremium?.decorate(page,user,name)'), 'Account page enhanced in place');
          assert(legacy.includes('supabaseClient.auth.getSession()'), 'Read actual authenticated user');
          assert(legacy.includes('supabaseClient.auth.updateUser({data:{full_name:value}})'), 'Name save remains functional');
          assert(legacy.includes("avatarInitial.textContent=value.slice(0,1).toUpperCase()"), 'Update avatar without dropping edit badge');
          assert(legacy.includes('window.openPhoneVerificationPage()'), 'Phone verification wizard remains functional');
          assert(logic.includes('user.created_at'), 'Membership date from real auth profile');
          assert(logic.includes('badge?.dataset.state'), 'Only verified backend status can show phone verification');
          assert(logic.includes("state==='verified'?'موثّق'"), 'Verified badge is conditional');
          assert(logic.includes("state==='unknown'?'تعذر التحقق'"), 'Unavailable verification is not trusted');
          assert(logic.includes('MutationObserver'), 'Phone badge follows Resala verified state');
          assert(logic.includes("window.renderResalaOtp(session.user)"), 'Refresh status after phone wizard');
          assert(phone.includes('window.L1017nPersonalPremium.refreshFromServer()'), 'Phone wizard updates account when verified');
          assert(logic.includes('premium-info-list') && logic.includes('premium-info-phone'));
          for(const k of ['user','mail','phone','shield','lock','calendar','edit','save'])assert(logic.includes(k+':'), 'Required account icon: '+k);
          assert(css.includes('.premium-personal-profile .personal-page-user'));
          assert(css.includes('.premium-info-row'));
          assert(css.includes('.personal-phone-heading'));
          assert(css.includes('prefers-reduced-motion'));
          assert(!logic.includes('wallet_transactions'), 'Cannot modify monetary transactions');
          assert(!logic.includes('sms_auto_credit_receipt'), 'Cannot bypass SMS payment verification');
          const sandbox={window:{},console,MutationObserver:class {}};
          vm.runInNewContext(logic,sandbox);
          assert.equal(typeof sandbox.window.L1017nPersonalPremium.decorate,'function');
          assert.equal(typeof sandbox.window.L1017nPersonalPremium.refreshFromServer,'function');
          console.log('Premium profile design, real membership, verified phone guard and name save passed.');
          JS
