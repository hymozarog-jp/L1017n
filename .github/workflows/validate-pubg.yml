name: Validate premium PUBG page

on:
  push:
    branches: [main]
    paths:
      - 'pubg-premium.js'
      - 'pubg-premium.css'
      - 'legacy-app.js'
      - 'app.js'
      - 'index.html'
      - '.github/workflows/validate-pubg.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check pubg-premium.js
          node --check legacy-app.js
          node --check app.js
      - name: Validate premium page integration
        run: |
          node - <<'JS'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html','utf8');
          const legacy = fs.readFileSync('legacy-app.js','utf8');
          const premium = fs.readFileSync('pubg-premium.js','utf8');
          const css = fs.readFileSync('pubg-premium.css','utf8');
          assert.match(html,/href="pubg-premium\.css\?v=/);
          assert.match(html,/src="pubg-premium\.js\?v=/);
          assert.match(legacy,/window\.renderPremiumPubg\(\)/);
          assert.match(premium,/window\.openInstantCodeCheckout\(selected\.id, selected\.name, selected\.price\)/);
          assert.match(premium,/key: "codes"/);
          assert.match(premium,/key: "charge"/);
          // PUBG now uses two switchable categories, with 60 UC under Codes.
          assert.match(premium,/CATEGORIES\\.map\\(/);
          assert.match(premium,/setCategory\\(root,"codes",false\\)/);
          assert.match(premium,/product_key \\|\\| ""\\)\\.toLowerCase\\(\\) === "pubg-60"\\) return "codes"/);
          assert.match(premium,/game-covers\\/pubg-uc\\.svg/);
          assert.match(premium,/noCodeAvailable/);
          assert.match(premium,/disabled aria-label="كود 60 UC غير متوفر حاليًا"/);
          assert.match(premium,/categoryProducts\\(key\\)/);
          assert.ok(fs.existsSync('game-covers/pubg-uc.svg'));
          assert.match(premium,/supabaseClient\.from\("products"\)/);
          assert.match(premium,/openPubgAccountCheckout\(selected\)/);
          assert.match(premium,/p_roblox_username:uid/);
          assert.match(premium,/create_purchase_order/);
          assert.match(css,/#pubgCategoryPage\.pubg-premium\.visible/);
          assert.match(css,/@media\(max-width:760px\)/);
          console.log('Premium PUBG page references and checkout wiring verified.');
          JS
