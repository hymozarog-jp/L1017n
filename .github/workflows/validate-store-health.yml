name: Validate active storefront integrity
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - '*.html'
      - 'game-covers/**'
      - '.github/workflows/validate-store-health.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - '*.html'
      - 'game-covers/**'
      - '.github/workflows/validate-store-health.yml'
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all storefront JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Validate local assets, account flows and protected wallet UI
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const read=p=>fs.readFileSync(p,'utf8');
          const html=read('index.html'),legacy=read('legacy-app.js');
          const history=read('account-history.js');
          const bellCss=read('header-notification-bell.css');
          const notices=read('notifications-page.js');
          assert(html.includes('id="headerNotificationBell"'),'Header bell is missing');
          assert(html.includes('data-account-action="notifications"'),
            'Header bell must open the existing notifications page');
          assert(html.includes('header-notification-bell.css?v='),
            'Header bell stylesheet must load');
          assert(legacy.includes("bell.classList.toggle('hidden',!user)"),
            'Header bell must follow signed-in user state');
          assert(notices.includes("[data-account-action=\"notifications\"]"),
            'Notification menu and bell must use the existing dialog handler');
          assert(bellCss.includes('prefers-reduced-motion:reduce'),
            'Bell animation needs reduced-motion support');
          assert(bellCss.includes('order:9!important;') && bellCss.includes('order:10!important;'),
            'Bell and avatar must have adjacent RTL order, avatar on far left');
          assert(html.includes('header-notification-bell.css?v=compact-cluster-20261104-1'),
            'Compact header layout must bypass cached CSS');
          assert(bellCss.includes('justify-content:flex-start!important;') &&
            bellCss.includes('column-gap:2px!important;'),
            'Mobile avatar, bell and wallet must have tight spacing');
          assert(!bellCss.includes('notification-badge'),
            'No fake unread badge is allowed');
          assert(html.includes('data-account-action="history"'),'My Account history entry is missing');
          assert(html.includes('account-history.js?v='),'History viewer is not loaded');
          assert(legacy.includes("action==='history'"),'History entry must open the viewer');
          assert(history.includes(".eq('user_id',id)"),'History must scope both reads to the signed-in user');
          assert(history.includes(".from('topup_requests')") && history.includes(".from('purchase_orders')"),
            'History must read both top-up and purchase orders');
          assert(history.includes("document.addEventListener('click',event=>"),
            'History entry needs a delegated click handler independent of account render');
          assert(history.includes("  },true);"),
            'History entry needs an early capture listener');
          const historyOpen=history.slice(history.indexOf('  function open(){'),
            history.indexOf('  // Bind the action directly'));
          assert(historyOpen.indexOf('const page=ensurePage();') < historyOpen.indexOf('void refresh();'),
            'History page must display before awaiting authentication');
          assert(history.includes('تعذّر التحقق من حسابك'),
            'Authentication failure must display an error instead of closing silently');
          const historyCss=read('account-history.css');
          for(const id of ['l1017HistoryAllCount','l1017HistoryTopupTabCount',
            'l1017HistoryPurchaseTabCount','l1017HistoryItems']){
            assert(history.includes(id),'Premium history control missing: '+id);
          }
          assert(!history.includes('<details'),'History rows must not expand or reveal details');
          assert(history.includes("['credit','+']") && history.includes("['debit','−']"),
            'Only settled credits and paid purchases should display signed amounts');
          assert(history.includes('l1017-history-amount'),'History amounts must use directional styling');
          assert(historyCss.includes('.l1017-history-amount.credit{color:#46d994}') &&
            historyCss.includes('.l1017-history-amount.debit{color:#ff6c78}'),
            'Credits must be green and debits red');
          assert(history.includes('l1017-history-empty'),'Empty history needs a useful empty state');
          assert(historyCss.includes('@media(max-width:430px)'),
            'History design must fit mobile phones');
          assert(html.includes('account-history.css?v=compact-signed-20261104-1'),
            'The latest history stylesheet must load');
          assert(legacy.includes(String.fromCharCode(36,36)+"('[data-view]').forEach"),
            'Navigation must iterate all [data-view] elements (querySelectorAll), not one Element');
          const primary=read('wallet-primary-toggle.js'),topup=read('auto-topup.js');
          const assets=[...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)]
            .map(x=>x[1].split(/[?#]/)[0])
            .filter(v=>v && !/^(?:https?:|data:|mailto:|tel:|#|\/)/i.test(v));
          for(const asset of assets)assert(fs.existsSync(asset),'Missing local asset: '+asset);
          const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m=>m[1]);
          assert.equal(ids.length,new Set(ids).size,'Duplicate HTML IDs');
          for(const id of ['googleSignInBtn','authModeLogin','authModeSignup','authEmail',
            'authPhone','authPassword','authSubmit','authStatus','forgotPassword',
            'walletView','walletShowcaseBalance','madarWalletBalance','walletActionPrimary',
            'walletActionTopup','walletActionSend','customerWalletChip']){
            assert(ids.includes(id),'Required storefront control missing: '+id);
          }
          assert(html.includes('auth-minimal-green.css?v='),'Login theme must load');
          assert(html.includes('auth-site-logo'),'Store login logo must exist');
          assert(html.includes('phone-verification-page.js?v='),'Phone OTP wizard must load');
          assert(html.includes('wallet-primary-toggle.js?v='),'Primary wallet selection must load');
          assert(primary.includes('selected={libyana:activate&&name==="libyana",madar:activate&&name==="madar"}'));
          assert(primary.includes('refreshTopWallet(user)'),'Selected carrier must update header');
          assert(legacy.includes('.select(\'balance,madar_balance\')'),'Header balance must follow carrier');
          assert(topup.includes('get_my_ussd_topup_status'),'Wallet top-ups require backend verification');
          assert(!topup.includes("rpc('sms_auto_credit_receipt'"),'Client cannot credit itself');
          assert(topup.includes('notifyAdminForReview(intent.request_id)'),
            'Every Libyana topup request must notify the store owner');
          assert(topup.includes("db.functions.invoke('l1017n-topup-notify'"),
            'Topup notifications must use authenticated server function');
          for(const file of ['legacy-app.js','instant-code.js','pubg-premium.js',
            'brainrot-store.js','store-menu.js']){
            assert(read(file).includes('l1017n-purchase-notify'),
              'Missing purchase owner notification in '+file);
          }
          assert(read('wallet-luxe.js').includes('supabaseClient.rpc("send_wallet_balance"'));
          assert(read('404.html').includes('href="/L1017n/"'),'Broken links need a safe home destination');
          for(const file of ['app.js','legacy-app.js','index.html','auto-topup.js']){
            const raw=read(file);
            assert(!/service_role|sk_live_|ghp_[A-Za-z0-9]{30}/i.test(raw),
              'Privileged credential marker in public browser asset: '+file);
          }
          console.log('Storefront syntax, local assets, login, phone, wallets, and safe payments passed');
          JS
