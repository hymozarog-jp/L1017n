name: Validate active storefront integrity
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - '*.html'
      - 'game-covers/**'
      - '.github/workflows/validate-store-health.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - '*.html'
      - 'game-covers/**'
      - '.github/workflows/validate-store-health.yml'
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all storefront JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Validate local assets, account flows and protected wallet UI
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const read=p=>fs.readFileSync(p,'utf8');
          const html=read('index.html'),legacy=read('legacy-app.js');
          const history=read('account-history.js');
          const loader=read('app.js');
          const stepWizard=read('topup-step-wizard.js');
          const premiumCss=read('topup-premium-illustrated.css');
          assert(html.includes('topup-premium-illustrated.css?v=wider-mobile-topup-20261104-1'),
            'Premium illustrated top-up stylesheet must be loaded after base wallet styling');
          assert(html.includes('topup-step-wizard.js?v=clear-icons-20261104-1') &&
            stepWizard.includes('topup-illustration-amount.svg?v=clear-icons-20261104-1'),
            'Safari must fetch the revised top-up banner and icons, not cached older artwork');
          assert(html.includes('<span class="tp-step-bubble" aria-hidden="true"><svg') &&
            html.includes('<ellipse cx="8" cy="7" rx="5.5" ry="2.5"/>') &&
            !html.includes('<span class="tp-step-bubble" aria-hidden="true">◇</span> المبلغ'),
            'The amount title must use a clear coin-stack SVG rather than an unclear diamond');
          for(const asset of ['topup-clear-coin-stack.svg','topup-clear-coin.svg']){
            assert(fs.existsSync(asset),'Missing clear amount icon: '+asset);
            const icon=read(asset);
            assert(icon.includes('<svg') && icon.includes('</svg>') &&
              icon.includes('<ellipse') && icon.includes('Gradient'),
              'Each new amount icon must be a complete, illustrated gold coin SVG');
            assert(premiumCss.includes(asset),'Every clear icon must actually be loaded by amount cards');
          }
          assert(premiumCss.includes('button[data-amount="1"]::before') &&
            premiumCss.includes('quick-amounts button[aria-pressed="true"]::before') &&
            premiumCss.includes('.tp-step-bubble svg'),
            'Individual amount tiles, selected tiles and amount heading must show crisp icons');
          const bannerArt=read('topup-illustration-amount.svg');
          assert(bannerArt.includes('Recognizable mint-green wallet') &&
            bannerArt.includes('Large clearly identifiable closed padlock') &&
            bannerArt.includes('<circle cx="308" cy="106" r="4"'),
            'Banner wallet and phone symbols must be replaced by legible wallet and lock artwork');
          assert(premiumCss.includes('max-width:680px!important;') &&
            premiumCss.includes('padding-right:6px!important;') &&
            premiumCss.includes('padding-left:6px!important;') &&
            premiumCss.includes('height:151px!important;') &&
            premiumCss.includes('min-height:76px!important;'),
            'Top-up must use nearly the full iPhone screen without squeezing the cards');
          assert(premiumCss.includes('#topupDedicatedPage #topupForm .tp-wizard-review') &&
            premiumCss.includes('@media(max-width:430px)') &&
            premiumCss.includes('@media(max-width:360px)'),
            'Tighter margins must apply to amount, sender, and review steps at small widths');
          const artFiles=[
            'topup-illustration-amount.svg',
            'topup-illustration-sender.svg',
            'topup-illustration-review.svg'
          ];
          for(const art of artFiles){
            assert(fs.existsSync(art),'Missing original top-up illustration: '+art);
            const drawing=read(art);
            assert(drawing.includes('<svg') && drawing.includes('<defs>') &&
              drawing.includes('</svg>') && drawing.includes('Gradient'),
              'Top-up artwork must be a complete illustrated SVG: '+art);
          }
          assert(stepWizard.includes("stageArt.className='tp-stage-art'") &&
            stepWizard.includes("stageImage.alt=''") &&
            stepWizard.includes("stageArt.setAttribute('aria-hidden','true')") &&
            stepWizard.includes("stageArt.dataset.step=String(stage)"),
            'All three stages must show accessible decorative art without affecting the inputs');
          for(const file of artFiles){
            assert(stepWizard.includes(file),'Illustration must be selected by stage: '+file);
          }
          assert(premiumCss.includes('grid-template-columns:repeat(3,minmax(0,1fr))!important') &&
            premiumCss.includes('.quick-amounts button[aria-pressed="true"]') &&
            premiumCss.includes('#topupAmount:focus') &&
            premiumCss.includes('.tp-wizard-notice-card #tpTopupNoticeUnderstood'),
            'Amount cards, selected state, phone input and فهمت note should be visibly redesigned');
          assert(premiumCss.includes('data-step="3"') &&
            premiumCss.includes('prefers-reduced-motion:reduce') &&
            premiumCss.includes('#topupForm .tp-wizard-review') &&
            premiumCss.includes('#topupForm .tp-proceed'),
            'Full recharge experience must be cohesive, responsive and accessible');
          const stepCss=read('topup-step-wizard.css');
          const topupFlow=read('auto-topup.js');
          assert(topupFlow.includes("db.rpc('is_libyana_topup_intake_enabled')") &&
            !topupFlow.includes("db.rpc('is_my_auto_libyana_topup_ready')") &&
            !topupFlow.includes("if(!verified.data?.verified)") &&
            topupFlow.includes("const otherSender=!phone||sender!==phone;"),
            'Customers may request manual Libyana top-up without OTP, but must use an actual sender');
          assert(topupFlow.includes("db.auth.getUser()") &&
            topupFlow.includes("if(auth.error||!auth.data?.user)"),
            'Customers must remain authenticated for all top-up requests');
          assert(stepWizard.includes("senderInput.setAttribute('aria-required',String(!hasVerifiedPhone))") &&
            stepCss.includes('.tp-phone-panel.tp-no-verified .tp-number-row') &&
            html.includes('data-tp-step="2"><b>2</b><span>رقم المحوّل</span>'),
            'Unverified customers must see the payer field instead of mandatory OTP controls');
          assert(stepWizard.includes('tpTopupNoticeUnderstood') &&
            stepWizard.includes('الرصيد يُضاف فقط بعد التأكد من وصول المبلغ وموافقة الإدارة.'),
            'Acknowledge the payment safety note with فهمت before manually reviewed transfer');

          assert(loader.includes("auto.src='auto-topup.js?v=manual-without-otp-20261104-1'"),
            'Live checkout must use the updated transfer source logic instead of cached auto-topup');
          assert(stepWizard.includes("id='tpTopupSenderNotice'") &&
            stepWizard.includes('tpTopupNoticeUnderstood') &&
            stepWizard.includes('فهمت') &&
            stepWizard.includes('مش لازم توثّق رقم ليبيانا'),
            'Phone step must display notice with a real فهمت acknowledgment button');
          assert(stepWizard.includes("const getSenderPhone=()=>") &&
            stepWizard.includes("getSenderPhone,reset") &&
            stepWizard.includes('if(!getSenderPhone())'),
            'Customer may enter a valid alternate Libyana sender without replacing their verified account');
          assert(stepWizard.includes("senderNotice.remove()") &&
            stepWizard.includes("node.id==='topupDedicatedPage'"),
            'Sender notice must close when the wallet recharge screen is dismissed');
          assert(stepCss.includes('.tp-wizard-notice-layer') &&
            stepCss.includes('#tpTopupNoticeUnderstood') &&
            stepCss.includes('#tpTopupSender') &&
            stepCss.includes('prefers-reduced-motion:reduce'),
            'Sender notice and phone field must be mobile-ready and motion accessible');
          assert(topupFlow.includes("db.rpc('create_ussd_topup_intent_for_sender',{p_amount:amount,p_sender_phone:sender})") &&
            topupFlow.includes("sender!==phone") &&
            topupFlow.includes("db.rpc('create_ussd_topup_intent',{p_amount:amount})"),
            'Different sender must use its protected backend RPC, same sender must keep existing flow');
          assert(topupFlow.includes('if(/sender_phone_reserved/.test(t))') &&
            topupFlow.includes('if(/sender_has_pending_request/.test(t))') &&
            topupFlow.includes("رقم المحوّل: '+sender"),
            'Third-party source conflicts must be explained clearly and displayed during checkout');
          assert(!stepWizard.includes("create_ussd_topup_intent"),
            'Acknowledgment or step navigation must never create a payment request on its own');

          const customerJourney=read('customer-journey.js');
          assert(!customerJourney.includes("updateWalletNext("),
            'Removed old wallet helper must never be invoked after its deletion');
          assert(customerJourney.includes('function refresh(){') &&
            customerJourney.includes('ensureWallet();') &&
            customerJourney.includes("document.getElementById('gbWalletGuide')?.remove();"),
            'Customer journey refresh must continue safely without the obsolete guide');
          assert(html.includes('customer-journey.js?v=fix-wallet-guide-reference-20261104-1'),
            'Safari must fetch updated customer journey code rather than cached broken script');
          assert(html.includes('customer-journey.js?v=fix-wallet-guide-reference-20261104-1'),
            'Old top-up helper must be loaded with an updated cache version');
          assert(!customerJourney.includes("guide.innerHTML='<strong>شحن المحفظة في 3 خطوات</strong>'") &&
            customerJourney.includes("document.getElementById('gbWalletGuide')?.remove();"),
            'Obsolete large green 3-step guide must no longer be rendered');
          assert(!html.includes('<div class="tp-steps" aria-label="خطوات شحن المحفظة">') &&
            !html.includes('id="tpAmountHint"') &&
            !html.includes('لازم التحويل يكون من نفس رقم ليبيانا الموثّق') &&
            !html.includes("subtitle.textContent='أكمل الخطوات التالية'"),
            'Repeated top-up explanations must be removed from the HTML source');
          assert(html.includes('#topupDedicatedPage #gbWalletGuide,#walletView #gbWalletGuide') &&
            stepCss.includes('data-tp-wizard-step="1"] .tp-providers'),
            'Even stale browser scripts must not resurrect the redundant guide and oversized payment-method card');
          assert(html.includes('id="topupVerifiedNumber"') &&
            html.includes('id="topupAmount"') &&
            html.includes('id="topupProceed"') &&
            stepWizard.includes('if(!button||button!==proceed||stage===3)return;'),
            'Removing duplicate copy must not affect three-step recharge navigation or secure checkout');

          assert(html.includes('topup-step-wizard.js?v=clear-icons-20261104-1') &&
            html.includes('topup-step-wizard.css?v=manual-without-otp-20261104-1'),
            'Sequential top-up wizard assets must load after the original checkout');
          assert(html.includes('id="topupProceed"') &&
            html.includes('id="topupVerifiedNumber"') &&
            html.includes('id="topupPhoneState"') &&
            html.includes('data-tp-step="3"'),
            'Wallet top-up must preserve existing inputs and three step indicators');
          assert(stepWizard.includes("document.addEventListener('click',async function(event)") &&
            stepWizard.includes("event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();") &&
            stepWizard.includes("if(!button||button!==proceed||stage===3)return;"),
            'Only first two steps may intercept Continue; final checkout must use original safe handler');
          assert(stepWizard.includes('if(!isValidAmount())') &&
            stepWizard.includes('setStage(2)') &&
            stepWizard.includes('if(!getSenderPhone())') &&
            stepWizard.includes('setStage(3)') &&
            !stepWizard.includes('الحساب يحتاج رقم ليبيانا موثّق للتعرّف عليك.'),
            'Top-up must validate the payer phone, but never block an unverified account phone');
          assert(stepWizard.includes('tp-wizard-review') &&
            stepWizard.includes('tp-wizard-back') &&
            stepWizard.includes("window.renderTopupPhoneStatus?.()"),
            'Top-up wizard must include review, previous-step control and current phone confirmation');
          assert(stepWizard.includes("const hasTransfer=!!instructions.querySelector('.auto-topup-transfer')") &&
            stepWizard.includes("instructions.querySelector('.auto-topup-transfer')?'true':'false'"),
            'Prepared USSD request must not be replaced with a fresh unsent wizard');
          assert(!stepWizard.includes("create_ussd_topup_intent") &&
            !stepWizard.includes("db.rpc('create_ussd_topup_intent'"),
            'Step navigation must never create a payment intent');
          assert(topupFlow.includes("db.rpc('create_ussd_topup_intent',{p_amount:amount})") &&
            topupFlow.includes("document.getElementById('topupProceed')?.addEventListener('click'"),
            'Original verified server payment initiation must remain the only checkout path');
          assert(stepCss.includes('#gbWalletGuide') &&
            stepCss.includes('data-tp-wizard-step="1"') &&
            stepCss.includes('data-tp-wizard-step="2"') &&
            stepCss.includes('data-tp-wizard-step="3"') &&
            stepCss.includes('display:none!important'),
            'Only the active top-up step should appear, without the redundant old guide');
          assert(stepCss.includes('prefers-reduced-motion:reduce') &&
            stepCss.includes('@media(max-width:390px)'),
            'Wallet wizard needs reduced motion support and iPhone layout');
          assert(stepWizard.includes("const titles={1:'متابعة',2:'متابعة',3:'تجهيز التحويل'}") &&
            stepWizard.includes("previous.textContent='رجوع ←'") &&
            stepWizard.includes('التحويل من رقم المحوّل الذي اخترته. الرصيد يُضاف بعد التحقق والموافقة.'),
            'Wizard buttons and essential payment advice must remain short and truthful');
          assert(!stepWizard.includes('راجع المبلغ ورقم ليبيانا قبل تجهيز كود التحويل.') &&
            !html.includes('المبالغ الكبيرة قد تحتاج مراجعة قبل إضافة الرصيد.') &&
            !html.includes('لازم التحويل يكون من نفس رقم ليبيانا الموثّق'),
            'Redundant text must be removed from amount, phone, and review stages');
          assert(stepCss.includes('#topupDedicatedPage .tp-clean-copy p{') &&
            stepCss.includes('display:none!important;'),
            'Remove repeated wizard subtitle beneath the main heading');


          // User-hidden ready-made packs 500,600,...,1000 must not reappear.
          assert(loader.includes('&robux-packs-500-1000-removed=20261104-1'),
            'Updated Robux preset list needs fresh legacy JS in every browser');
          const picks=legacy.match(/\+\[([0-9,]+)\]\.map\(q=>'<button class="rqc-amount-chip"/);
          assert(picks,'Robux quick-pick list must be present');
          assert.deepEqual(picks[1].split(',').map(Number),[100,200,400],
            'Only 100, 200 and 400 Robux may remain in quick picks');
          const catalogMarker="Number(p.amount)>=100 && Number(p.amount)<500 && Number(p.amount)%100===0 && Number(p.amount)!==300";
          assert(legacy.includes(catalogMarker),
            'Ready-made Robux catalog must exclude 500 through 1000');
          assert(legacy.includes("String(p.product_key||'').startsWith('robux-promo-')"),
            'The existing special 300 Robux promotional offer must remain');
          const isPreset=amount=>Number.isInteger(amount) && amount>=100 && amount<500 &&
            amount%100===0 && amount!==300;
          assert.deepEqual([100,200,300,400,500,600,700,800,900,1000].filter(isPreset),
            [100,200,400], 'Package range filter must hide 500 through 1000');

          assert(html.includes('app.js?v=manual-without-otp-20261104-1') &&
            loader.includes('&fast-auth=20261104-1'),
            'Fast-auth bootstrap must bypass stale app and legacy script caches');
          assert(html.includes('rel="preconnect" href="https://cdn.jsdelivr.net"') &&
            html.includes('rel="preconnect" href="https://cmtxsjlehjworqypbxjz.supabase.co"'),
            'Auth dependencies must be connected early');
          assert(legacy.includes('let currentUserInFlight=null;') &&
            legacy.includes('if(currentUserInFlight)return currentUserInFlight;') &&
            legacy.includes('supabaseClient.auth.getUser().then('),
            'Parallel account checks must share server-validated user lookups');
          assert(legacy.includes("function showKnownSessionQuickly(user)") &&
            legacy.includes("showKnownSessionQuickly(session?.user||null)") &&
            legacy.includes("renderGoogleHeaderAvatar(user)") &&
            legacy.includes("currentUserInFlight=null;"),
            'Account identity must render immediately from session metadata on auth events');
          assert(legacy.includes("renderCustomerHeaderWallet(session?.user||null)") &&
            legacy.includes('let customerHeaderWalletQuery=null;') &&
            legacy.includes('pending=Promise.resolve(supabaseClient.from('),
            'Header balance must load immediately with a single shared user-scoped request');
          assert(legacy.includes("eq('user_id',user.id).maybeSingle()") &&
            legacy.includes('auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}'),
            'Fast account loading must preserve protected wallet queries and persistent auth');

          const bellCss=read('header-notification-bell.css');
          const notices=read('notifications-page.js');
          const tapJs=read('ui-motion.js'),tapCss=read('ui-motion.css');
          assert(html.includes('ui-motion.css?v=global-taps-20261104-1') &&
            html.includes('ui-motion.js?v=global-taps-20261104-1'),
            'Click motion assets must be loaded with a fresh cache version');
          assert(tapJs.includes("document.addEventListener('pointerdown'") &&
            tapJs.includes("document.addEventListener('click'") &&
            tapJs.includes('target.animate(['),
            'Shared click reactions must cover touch and keyboard activation');
          for(const action of ["'button'","'a[href]'","'[data-ll-game]'","'.orders-modern-card'"]){
            assert(tapJs.includes(action),'Tap motions need interaction category '+action);
          }
          assert(tapJs.includes("prefers-reduced-motion: reduce") &&
            tapCss.includes('prefers-reduced-motion:reduce'),
            'Global motion system must respect reduced-motion preferences');
          assert(!tapJs.includes('preventDefault(') && !tapJs.includes('stopPropagation('),
            'Tap animations must not interfere with checkout and navigation actions');
          assert(tapCss.includes('l1017-tap-glow') &&
            tapCss.includes('l1017TapBounce') &&
            tapCss.includes('pointer-events:none!important'),
            'Press feedback must be visible and never block taps');

          const royal=read('leaderboard-royal.js');
          const royalCss=read('leaderboard-royal.css');
          const ranking=read('google-leaderboard.js');
          assert(html.includes('leaderboard-royal.js?v=only-compact-rank-20261104-1') &&
            html.includes('leaderboard-royal.css?v=rank-colors-line-20261104-1'),
            'Compact personal rank assets must have a fresh cache version');
          assert(royal.includes("podium.insertAdjacentElement('afterend',mini)") &&
            royal.includes("ownRank?.querySelector('.lb-self-position strong')"),
            'Personal mini rank must follow the top-three podium and use a real rank');
          assert(royal.includes("ownRank.classList.contains('hidden')") &&
            royal.includes('observer.observe(ownRank') &&
            royal.includes("if(value&&value.textContent!==number)value.textContent=number;"),
            'Mini rank must hide for guests and update with personal account changes');
          assert(ranking.includes("supabaseClient.rpc('get_my_store_leaderboard_rank')"),
            'Personal rank must originate from server RPC rather than client-side estimates');
          assert(royalCss.includes('#leaderboardView #royalMiniMyRank.royal-mini-my-rank') &&
            royalCss.includes('order:3!important') &&
            royalCss.includes('@media(max-width:520px)'),
            'Personal mini rank needs podium-adjacent ordering and mobile styling');
          assert(royalCss.includes('#leaderboardView .royal-intro::after') &&
            royalCss.includes('background:linear-gradient(90deg,') &&
            royalCss.includes('border-top:7px solid var(--tone)!important;'),
            'Podium must have a clear 3-color guide and colored top lines');
          for(const color of ['#ffd469','#a8d7ff','#ffb594']){
            assert(royalCss.includes('border-top-color:'+color+'!important;'),
              'Missing distinctive color for a top-three rank: '+color);
          }
          assert(royalCss.includes('#leaderboardView .lb-money-rail{') &&
            royalCss.includes('height:13px!important;') &&
            royalCss.includes('#leaderboardView .lb-second .lb-money-fill{'),
            'Leaderboard progress color bars must be legible and rank-specific');
          assert(royalCss.includes('border-inline-start:5px solid #bb84ff!important;'),
            'Other shoppers need a visible purple rank marker');

          assert(royalCss.includes('#leaderboardView #lbMyRank,') &&
            royalCss.includes('#leaderboardView .l1017-rank-mini-heading{') &&
            royalCss.includes('display:none!important;'),
            'Old full-size personal ranking and duplicate heading must be hidden');
          assert(royal.includes('royal-mini-rank-settings') &&
            royal.includes("document.querySelector('[data-account-action=\"ranking-privacy\"]')?.click()"),
            'Compact card must retain an accessible route to ranking privacy');
          assert(html.includes('data-account-action="ranking-privacy"'),
            'Existing privacy settings entry must remain available');

          assert(html.includes('id="headerNotificationBell"'),'Header bell is missing');
          assert(html.includes('data-account-action="notifications"'),
            'Header bell must open the existing notifications page');
          assert(html.includes('header-notification-bell.css?v='),
            'Header bell stylesheet must load');
          assert(legacy.includes("bell.classList.toggle('hidden',!user)"),
            'Header bell must follow signed-in user state');
          assert(notices.includes("[data-account-action=\"notifications\"]"),
            'Notification menu and bell must use the existing dialog handler');
          const noticesCss=read('notifications-page.css');
          assert(html.includes('notifications-page.js?v=unread-bell-20261104-1') &&
            html.includes('notifications-page.css?v=verified-status-messages-20261104-1'),
            'Updated notifications activity screen assets must bypass cached versions');
          for(const selector of ['npActivityList','data-np-filter','np-refresh','np-orders','np-history']){
            assert(notices.includes(selector),'Notification activity control missing: '+selector);
          }
          assert(notices.includes(".from('topup_requests')") &&
            notices.includes(".from('purchase_orders')") && notices.includes(".eq('user_id',id)"),
            'Notifications must show real user-scoped records, never fabricated alerts');
          assert(notices.includes('history.pushState(') && notices.includes("window.addEventListener('popstate'"),
            'Notification dialog must preserve back navigation');
          assert(!notices.includes('Notification.requestPermission') &&
            !notices.includes('unread_count'),
            'Notification page must not fake unread badges or request push permissions');
          assert(noticesCss.includes('@media(max-width:420px)') &&
            noticesCss.includes('prefers-reduced-motion:reduce'),
            'Notification center must support narrow screens and reduced motion');
          const messagesSrc=notices.slice(notices.indexOf(' function moneyText('),notices.indexOf(' function itemHtml('));
          assert(messagesSrc.startsWith(' function moneyText('),'Verified event generator is missing');
          const messagesForTest=new Function('label',messagesSrc+';return messagesFor;')
            (row=>row.product_name||'طلب شراء');
          assert.equal(messagesForTest({kind:'topup',status:'pending',amount:50}).length,0,
            'Pending top-up must never claim the balance was credited');
          assert.equal(messagesForTest({kind:'topup',status:'approved',amount:50})[0].kind,'credit',
            'Approved top-up must produce a wallet credit message');
          assert.equal(messagesForTest({kind:'purchase',status:'paid_pending_fulfillment'}).length,0,
            'A merely paid order must not claim the store accepted delivery');
          assert.equal(messagesForTest({kind:'purchase',status:'approved',product_name:'MM2'})[0].kind,'accepted',
            'Approved purchase needs an acceptance message');
          const delivered=messagesForTest({kind:'purchase',status:'completed',product_name:'MM2'});
          assert.deepEqual(delivered.map(x=>x.kind),['delivered','accepted'],
            'Completed purchase must retain acceptance and show delivered message');
          assert(notices.includes('watchOrderStatuses') && notices.includes('if(was===now)continue;') &&
            notices.includes('observedUser!==userId||!observed.has(key)'),
            'Live messages must come from genuine status changes and skip baseline history');
          assert(notices.includes(".eq('user_id',userId)") && notices.includes('setInterval(()=>{void watchOrderStatuses()},30000)'),
            'In-app notification checks must be user-scoped and run while the store is open');
          assert(noticesCss.includes('.np-live-toast') && noticesCss.includes('.np-event-credit') &&
            noticesCss.includes('.np-event-delivered') && noticesCss.includes('.np-event-accepted'),
            'Verified messages need visible branded styles');

          // Real per-account unread state: one red badge for one verified new event.
          assert(html.includes('id="headerNotificationCount"') &&
            html.includes('class="header-notification-count" hidden'),
            'A hidden-by-default unread count must exist inside the header bell');
          assert(bellCss.includes('.header-notification-count[hidden]') &&
            bellCss.includes('background:linear-gradient(145deg,#ff5865,#e02037)!important;') &&
            bellCss.includes('overflow:visible!important;'),
            'Red count must stand out without clipping or showing when empty');
          assert(legacy.includes('window.L1017nNotifications?.syncUser(user||null);'),
            'Unread state must track current login and hide immediately on sign-out');
          assert(notices.includes("eventKey:key+':credit'") &&
            notices.includes("eventKey:key+':accepted'") &&
