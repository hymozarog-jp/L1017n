name: Validate independent primary wallets and secure sending
on:
  push:
    branches: [main]
    paths:
      - 'wallet-luxe.js'
      - 'wallet-luxe.css'
      - 'wallet-madar-match.css'
      - 'wallet-two-primary.css'
      - 'index.html'
      - 'app.js'
      - 'legacy-app.js'
      - '.github/workflows/validate-wallet-luxe.yml'
  workflow_dispatch:
jobs:
  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate wallet rendering, separate balances and verified transfer flow
        run: |
          node --check wallet-luxe.js
          node --check legacy-app.js
          node --check app.js
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('app.js','utf8');
          const legacy=fs.readFileSync('legacy-app.js','utf8');
          const ui=fs.readFileSync('wallet-luxe.js','utf8');
          const original=fs.readFileSync('wallet-luxe.css','utf8');
          const separate=fs.readFileSync('wallet-two-primary.css','utf8');
          const madar=fs.readFileSync('wallet-madar-match.css','utf8');
          for(const id of ['walletActionTopup','walletActionTransfer','walletActionSend',
            'walletShowcaseBalance','madarWalletBalance','topupHistory','walletView']){
            assert(html.includes('id="'+id+'"'),'Missing active wallet element: '+id);
          }
          assert(!html.includes('id="walletActionPrimary"'),'A shared third wallet must not be shown');
          assert.equal((html.match(/class="wallet-independent-tag">محفظة أساسية/g)||[]).length,2,
            'Each carrier must have its own primary wallet indicator');
          assert(html.includes('wallet-two-primary.css?v=separate-wallets-1'));
          assert(html.includes('wallet-madar-match.css?v=madar-green-20261031-1'));
          assert(html.includes('wallet-transactions.css?v=wallet-row1'));
          assert(html.includes('wallet-luxe.js?v=two-primary-wallets-1'));
          assert(html.includes('app.js?v=two-primary-wallets-1'));
          assert(app.includes('legacy-app.js?v=two-primary-wallets-1'));
          assert.match(separate,/grid-template-columns:minmax\(0,1fr\)!important/,'Mobile wallets must stack individually');
          assert.match(separate,/grid-template-columns:repeat\(2,minmax\(0,1fr\)\)!important/,'Desktop wallets must be independent');
          assert.match(madar,/#madarWalletBalance/,'Madar must use the active balance field');
          assert.match(legacy,/from\('wallet_accounts'\)\.select\('balance,madar_balance,primary_balance'\)/,
            'Both balances must remain server-owned');
          assert(legacy.includes('Number(wallet?.madar_balance||0)'),'Madar balance is independent');
          assert(legacy.includes('Number(wallet?.balance||0)'),'Libyana balance is independent');
          assert(!legacy.includes("$('#walletActionPrimary').onclick"));
          assert(legacy.includes('walletTransactionRows(list)'),'Existing wallet history stays intact');
          assert(legacy.includes('window.L1017nWalletLuxe.animateBalance'));
          assert(legacy.includes('window.L1017nWalletLuxe.resetBalance'));
          assert(ui.includes('supabaseClient.rpc("send_wallet_balance"'),'Sending must invoke the secured database RPC');
          assert(ui.includes('p_request_key:pending.key'),'Retry must use an idempotency key');
          assert(ui.includes('walletTransferConfirm'),'Show transfer confirmation before sending');
          assert(ui.includes('wallet-sheet-result'),'Show transfer results');
          assert(!ui.includes("from('wallet_accounts').update("),'UI cannot write wallet balances directly');
          assert(original.includes('#walletActionSend.wallet-sending'));
          assert(original.includes('@keyframes walletPlaneFly'));
          assert(original.includes('#walletSendSheet[hidden]'));
          const sandbox={window:{matchMedia:()=>({matches:true})},document:{readyState:'loading',addEventListener:()=>{}},console};
          vm.runInNewContext(ui,sandbox);
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.openSend,'function');
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.animateBalance,'function');
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.resetBalance,'function');
          console.log('Independent wallets, real balance fields and secured transfer UI validated.');
          JS
