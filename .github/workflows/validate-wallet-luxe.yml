name: Validate wallet luxe animation and safe sending preview
on:
  push:
    branches: [main]
    paths:
      - 'wallet-luxe.js'
      - 'wallet-luxe.css'
      - 'index.html'
      - 'app.js'
      - 'legacy-app.js'
      - '.github/workflows/validate-wallet-luxe.yml'
  workflow_dispatch:
jobs:
  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify wallet JS, real balance and transfer safety
        run: |
          node --check wallet-luxe.js
          node --check legacy-app.js
          node --check app.js
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('app.js','utf8');
          const legacy=fs.readFileSync('legacy-app.js','utf8');
          const ui=fs.readFileSync('wallet-luxe.js','utf8');
          const css=fs.readFileSync('wallet-luxe.css','utf8');
          for(const id of ['walletActionTopup','walletActionTransfer','walletActionSend','walletActionPrimary','walletShowcaseBalance','topupHistory','walletView']){
            assert(html.includes('id="'+id+'"'),'Wallet element missing: '+id);
          }
          assert(html.includes('wallet-luxe.css?v=wallet-luxe3'));
          assert(html.includes('wallet-transactions.css?v=wallet-row1'));
          assert(legacy.includes('walletTransactionRows(list)'),'History should use compact rows');
          assert(html.includes('wallet-luxe.js?v=wallet-luxe3'));
          assert(html.includes('app.js?v=profile-glow2'));
          assert(app.includes('legacy-app.js?v=profile-glow2'));
          assert(html.includes('aria-controls="walletSendSheet"'));
          assert(legacy.includes("window.L1017nWalletLuxe.openSend()"),'Send button opens real preview');
          assert(legacy.includes("window.L1017nWalletLuxe.animateBalance"),'Animate only data from authenticated wallet');
          assert(legacy.includes("window.L1017nWalletLuxe.resetBalance"),'Reset on logout');
          assert(legacy.includes("window.L1017nWalletLuxe?.closeSend()"),'Close when leaving wallet');
          assert(legacy.includes('getUser()') || legacy.includes('currentUser()'));
          assert(legacy.includes("from('wallet_accounts').select('balance,madar_balance,primary_balance')"),'Balances must come from Supabase, not UI numbers');
          assert(legacy.includes('window.openDedicatedTopup') || html.includes('window.openDedicatedTopup'),'Do not break top-ups');
          assert(ui.includes('No money transfers, transaction records, SMS, or wallet mutations here'));
          assert(ui.includes('wallet-feature-unavailable'),'Warn transfer is unavailable');
          assert(ui.includes('لن يتم إرسال أو خصم أي مبلغ'),'Never falsely claim a transfer');
          assert(ui.includes('event.preventDefault()'),'Submitting preview cannot transfer');
          assert(ui.includes('wallet-sheet-result'),'Preview feedback required');
          assert(!ui.includes('functions.invoke('),'No transfer RPC');
          assert(!ui.includes('.rpc('),'No wallet RPC');
          assert(!ui.includes('wallet_transactions'),'No wallet DB inserts');
          assert(css.includes('#walletActionSend.wallet-sending'));
          assert(css.includes('@keyframes walletPlaneFly'));
          assert(css.includes('@media(prefers-reduced-motion:reduce)'));
          assert(css.includes('#walletSendSheet[hidden]'));
          const sandbox={window:{matchMedia:()=>({matches:true})},document:{readyState:'loading',addEventListener:()=>{}},console};
          vm.runInNewContext(ui,sandbox);
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.openSend,'function');
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.animateBalance,'function');
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.resetBalance,'function');
          console.log('Wallet UI, visual animation, safe non-transferring preview, and account balance guards validated');
          JS
