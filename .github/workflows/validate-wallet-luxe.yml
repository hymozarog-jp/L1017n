name: Validate synced primary wallet header logo and balance
on:
  push:
    branches: [main]
    paths:
      - 'wallet-luxe.js'
      - 'wallet-luxe.css'
      - 'wallet-madar-match.css'
      - 'wallet-primary-toggle.css'
      - 'wallet-primary-toggle.js'
      - 'index.html'
      - 'app.js'
      - 'legacy-app.js'
      - '.github/workflows/validate-wallet-luxe.yml'
  workflow_dispatch:
jobs:
  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original carousel, independent primary labels and secure balances
        run: |
          node --check wallet-primary-toggle.js
          node --check wallet-luxe.js
          node --check legacy-app.js
          node --check app.js
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('app.js','utf8');
          const legacy=fs.readFileSync('legacy-app.js','utf8');
          const luxe=fs.readFileSync('wallet-luxe.js','utf8');
          const primary=fs.readFileSync('wallet-primary-toggle.js','utf8');
          const css=fs.readFileSync('wallet-primary-toggle.css','utf8');
          const headerCSS=fs.readFileSync('libyana-header-chip.css','utf8');
          for(const id of ['walletActionTopup','walletActionTransfer','walletActionSend',
            'walletActionPrimary','walletShowcaseBalance','madarWalletBalance','topupHistory','walletView']){
            assert(html.includes('id="'+id+'"'),'Wallet element missing: '+id);
          }
          assert.equal((html.match(/data-wallet-primary="/g)||[]).length,2,
            'Both wallets need independent primary buttons');
          assert(html.includes('data-wallet-primary="libyana"'));
          assert(html.includes('data-wallet-primary="madar"'));
          assert(html.includes('wallet-primary-toggle.css?v=header-logo-sync-3'));
          assert(html.includes('wallet-primary-toggle.js?v=header-logo-sync-3'));
          assert(!html.includes('wallet-two-primary.css?v=separate-wallets-1'),
            'Restore original swiping carousel instead of stacked cards');
          assert(!html.includes('wallet-separate-head'));
          assert.match(css,/scroll-snap-type:x mandatory!important/);
          assert.match(css,/grid-template-columns:repeat\(4,minmax\(0,1fr\)\)!important/);
          assert.match(css,/#walletView \.madar-wallet-card \.wallet-primary-toggle/);
          assert.match(css,/\.wallet-primary-toggle\[aria-pressed="false"\]::before/,'Inactive state must show plus icon');
          assert.match(css,/\.wallet-primary-toggle\[aria-pressed="true"\]/,'Active state must be visually highlighted');
          assert(primary.includes('selected={libyana:activate&&name==="libyana",madar:activate&&name==="madar"}'),
            'Selecting a primary wallet must automatically deactivate the other');
          assert(primary.includes('const madar=value?.madar===true&&!libyana'),
            'Old dual-primary saved preferences should be normalized');
          assert(primary.includes('button.textContent=active?"✓ الأساسية":"اجعلها أساسية"'),
            'Active and inactive states must have distinguishable labels');
          assert(primary.includes('identity?"l1017n-primary-wallets-v1:"'),
            'Primary status should be stored per signed-in user');
          assert(primary.includes('window.localStorage.setItem(storageKey(),JSON.stringify(selected))'));
          assert(primary.includes('getSelectedFor(userId)'),'Header image must respect the signed-in account');
          assert(primary.includes('refreshTopWallet(user)'),'Changing primary must refresh the header immediately');
          assert(legacy.includes("window.L1017nPrimaryWallets?.getSelectedFor?.(user?.id)"),
            'Header must use the primary choice for its current user');
          assert(legacy.includes("isMadar?'#walletView .madar-brand-mark img':'#walletView .libyana-brand-mark img'"),
            'Reuse actual carrier logo from existing wallet cards');
          assert(legacy.includes(".select('balance,madar_balance')"),
            'Top header must load both balances from authenticated account');
          assert(legacy.includes("isMadar?data?.madar_balance||0:data?.balance||0"),
            'The logo and amount must always describe the same wallet');
          assert(legacy.includes("dataset.walletCarrier==='madar'"),
            'Do not allow the Madar top-up shortcut to open Libyana charging');
          assert.match(css,/#customerWalletChip\.gb-libyana-wallet-chip\[data-wallet-carrier="madar"\]/);
          assert.match(headerCSS,/#customerWalletChip\.gb-libyana-wallet-chip/);
          assert(!primary.includes('.rpc('),'Primary preference must not spend or transfer money');
          assert(!primary.includes('.from('),'Primary preference must not update wallet DB tables');
          assert.match(legacy,/from\('wallet_accounts'\)\.select\('balance,madar_balance,primary_balance'\)/,
            'Carrier balances must remain separate server-backed fields');
          assert(legacy.includes('Number(wallet?.madar_balance||0)'));
          assert(legacy.includes('Number(wallet?.balance||0)'));
          assert(luxe.includes('supabaseClient.rpc("send_wallet_balance"'),
            'Keep real wallet-to-wallet sending unchanged');
          assert(luxe.includes('p_request_key:pending.key'));
          assert(html.includes('شحن المدار قريبًا'));
          const sandbox={window:{matchMedia:()=>({matches:true})},document:{readyState:'loading',addEventListener:()=>{}},console};
          vm.runInNewContext(luxe,sandbox);
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.openSend,'function');
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.animateBalance,'function');
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.resetBalance,'function');
          (async()=>{
          // Behavioral regression: a legacy account saved with both primaries
          // is normalized, and selecting a new primary disables the former one.
          const store=new Map([['l1017n-primary-wallets-v1:test-user',JSON.stringify({libyana:true,madar:true})]]);
          const fakeButton=()=>({
            attrs:{},setAttribute(n,v){this.attrs[n]=v;},
            querySelector(){return {textContent:''}},
            textContent:'',title:''
          });
          const buttonL=fakeButton(),buttonM=fakeButton(),action=fakeButton();
          const cardL={dataset:{},getBoundingClientRect:()=>({left:0,right:200})};
          const cardM={dataset:{},getBoundingClientRect:()=>({left:220,right:420})};
          const carousel={addEventListener:()=>{},getBoundingClientRect:()=>({left:0,width:200})};
          const handlers={};
          const documentMock={
            readyState:'complete',
            querySelector(selector){
              return {
                '#walletView .wallet-carousel>.wallet-hero':cardL,
                '#walletView .wallet-carousel>.madar-wallet-card':cardM,
                '#walletView .wallet-carousel':carousel,
                '[data-wallet-primary="libyana"]':buttonL,
                '[data-wallet-primary="madar"]':buttonM
              }[selector]||null;
            },
            getElementById(id){return id==='walletActionPrimary'?action:null;},
            addEventListener(type,fn){handlers[type]=fn;},
            hidden:false
          };
          const headerUpdates=[];
          const context={
            renderCustomerHeaderWallet:user=>{headerUpdates.push(user?.id||null)},
            window:{
              localStorage:{getItem:key=>store.get(key)||null,setItem:(key,val)=>store.set(key,val)},
              addEventListener:()=>{},setTimeout:()=>{}
            },
            document:documentMock,
            currentUser:async()=>({id:'test-user'}),
            toast:()=>{},
            console
          };
          vm.runInNewContext(primary,context);
          const settle=()=>new Promise(resolve=>setImmediate(resolve));
          await settle();
          function state(){return JSON.parse(store.get('l1017n-primary-wallets-v1:test-user'))}
          assert.deepEqual(state(),{libyana:true,madar:false});
          assert.equal(buttonM.attrs['aria-pressed'],'false');
          assert.equal(buttonL.attrs['aria-pressed'],'true');
          async function clickCarrier(name){
            const btn={dataset:{walletPrimary:name}};
            const event={
              target:{closest:selector=>selector==='[data-wallet-primary]'?btn:null},
              preventDefault:()=>{},stopPropagation:()=>{}
            };
            handlers.click(event);await settle();
          }
          await clickCarrier('madar');
          assert.deepEqual(state(),{libyana:false,madar:true});
          assert.equal(context.window.L1017nPrimaryWallets.getSelectedFor('test-user'),'madar');
          assert.equal(headerUpdates.at(-1),'test-user');
          assert.equal(buttonL.attrs['aria-pressed'],'false');
          assert.equal(buttonM.attrs['aria-pressed'],'true');
          await clickCarrier('libyana');
          assert.deepEqual(state(),{libyana:true,madar:false});
          assert.equal(context.window.L1017nPrimaryWallets.getSelectedFor('test-user'),'libyana');
          await clickCarrier('libyana');
          assert.deepEqual(state(),{libyana:false,madar:false});
          assert.equal(context.window.L1017nPrimaryWallets.getSelectedFor('test-user'),null);
          console.log('Exclusive primary buttons and previous saved preferences verified.');
          })().catch(error=>{console.error(error);process.exitCode=1});

          console.log('Dual primary UI, restored swipe carousel and untouched wallet balances verified.');
          JS
