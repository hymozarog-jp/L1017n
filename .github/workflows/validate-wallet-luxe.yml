name: Validate dual primary buttons and wallet carousel
on:
  push:
    branches: [main]
    paths:
      - 'wallet-luxe.js'
      - 'wallet-luxe.css'
      - 'wallet-madar-match.css'
      - 'wallet-primary-toggle.css'
      - 'wallet-primary-toggle.js'
      - 'index.html'
      - 'app.js'
      - 'legacy-app.js'
      - '.github/workflows/validate-wallet-luxe.yml'
  workflow_dispatch:
jobs:
  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original carousel, independent primary labels and secure balances
        run: |
          node --check wallet-primary-toggle.js
          node --check wallet-luxe.js
          node --check legacy-app.js
          node --check app.js
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('app.js','utf8');
          const legacy=fs.readFileSync('legacy-app.js','utf8');
          const luxe=fs.readFileSync('wallet-luxe.js','utf8');
          const primary=fs.readFileSync('wallet-primary-toggle.js','utf8');
          const css=fs.readFileSync('wallet-primary-toggle.css','utf8');
          for(const id of ['walletActionTopup','walletActionTransfer','walletActionSend',
            'walletActionPrimary','walletShowcaseBalance','madarWalletBalance','topupHistory','walletView']){
            assert(html.includes('id="'+id+'"'),'Wallet element missing: '+id);
          }
          assert.equal((html.match(/data-wallet-primary="/g)||[]).length,2,
            'Both wallets need independent primary buttons');
          assert(html.includes('data-wallet-primary="libyana"'));
          assert(html.includes('data-wallet-primary="madar"'));
          assert(html.includes('wallet-primary-toggle.css?v=carousel-dual-primary-1'));
          assert(html.includes('wallet-primary-toggle.js?v=carousel-dual-primary-1'));
          assert(!html.includes('wallet-two-primary.css?v=separate-wallets-1'),
            'Restore original swiping carousel instead of stacked cards');
          assert(!html.includes('wallet-separate-head'));
          assert.match(css,/scroll-snap-type:x mandatory!important/);
          assert.match(css,/grid-template-columns:repeat\(4,minmax\(0,1fr\)\)!important/);
          assert.match(css,/#walletView \.madar-wallet-card \.wallet-primary-toggle/);
          assert(primary.includes('selected[name]=!selected[name]'),
            'The two badges must toggle separately');
          assert(primary.includes('identity?"l1017n-primary-wallets-v1:"'),
            'Primary status should be stored per signed-in user');
          assert(primary.includes('window.localStorage.setItem(storageKey(),JSON.stringify(selected))'));
          assert(!primary.includes('.rpc('),'Primary preference must not spend or transfer money');
          assert(!primary.includes('.from('),'Primary preference must not update wallet DB tables');
          assert.match(legacy,/from\('wallet_accounts'\)\.select\('balance,madar_balance,primary_balance'\)/,
            'Carrier balances must remain separate server-backed fields');
          assert(legacy.includes('Number(wallet?.madar_balance||0)'));
          assert(legacy.includes('Number(wallet?.balance||0)'));
          assert(luxe.includes('supabaseClient.rpc("send_wallet_balance"'),
            'Keep real wallet-to-wallet sending unchanged');
          assert(luxe.includes('p_request_key:pending.key'));
          assert(html.includes('شحن المدار قريبًا'));
          const sandbox={window:{matchMedia:()=>({matches:true})},document:{readyState:'loading',addEventListener:()=>{}},console};
          vm.runInNewContext(luxe,sandbox);
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.openSend,'function');
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.animateBalance,'function');
          assert.equal(typeof sandbox.window.L1017nWalletLuxe.resetBalance,'function');
          console.log('Dual primary UI, restored swipe carousel and untouched wallet balances verified.');
          JS
