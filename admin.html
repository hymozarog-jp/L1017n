<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L1017n | لوحة الإدارة</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"><style>body{margin:0;background:#07110c;color:#eef8ef;font-family:'IBM Plex Sans Arabic',sans-serif}.wrap{width:min(1100px,92%);margin:40px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.panel{background:#0d1b13;border:1px solid #ffffff14;border-radius:20px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid #ffffff12;border-radius:16px;padding:16px;background:#ffffff04}.card input{width:100%;box-sizing:border-box;margin:10px 0;padding:11px;border-radius:10px;border:1px solid #ffffff16;background:#07110c;color:#fff}.btn{border:0;border-radius:12px;padding:11px 15px;cursor:pointer}.primary{background:#a8f36b;color:#08120e}.soft{background:#ffffff10;color:#fff}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff10;padding:14px 0}.muted{color:#91a397;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>لوحة إدارة L1017n</h1><div id="who" class="muted">جاهز لتسجيل الدخول</div></div><button id="logout" class="btn soft">تسجيل الخروج</button></div><section id="login" class="panel"><h2>دخول الإدارة</h2><p class="muted">الدخول مسموح فقط لحساب الإدارة المحدد.</p><input id="email" type="email" value="mommedmmkk@gamil.com" readonly style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ffffff16;background:#07110c;color:#fff"><br><br><button id="send" class="btn primary">إرسال رابط الدخول</button></section><section id="dashboard" style="display:none"><div class="panel"><h2>باقات Roblox والأسعار</h2><div id="products" class="grid"></div></div><div class="panel"><h2>طلبات الشراء</h2><div id="orders"></div></div><div class="panel"><h2>طلبات شحن المحفظة</h2><div id="topups"></div></div></section><p id="msg" class="muted"></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2'"></script><script>const URL='https://cmtxsjlehjworqypbxjz.supabase.co',KEY='sb_publishable_NrahtO5qp8p4OgjODMbxdQ_XqbUWSAk',ADMIN_EMAIL='mommedmmkk@gamil.com';if(!window.supabase){document.querySelector('#who').textContent='تعذر تحميل مكتبة تسجيل الدخول؛ حدّث الصفحة أو جرّب شبكة أخرى.';throw new Error('Supabase JS library failed to load')}const sb=supabase.createClient(URL,KEY);const $=s=>document.querySelector(s);const msg=t=>$('#msg').textContent=t;const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function user(){const {data,error}=await sb.auth.getSession();if(error)throw error;return data.session?.user||null}async function load(){try{const u=await user();if(!u||u.email?.toLowerCase()!==ADMIN_EMAIL){$('#login').style.display='block';$('#dashboard').style.display='none';$('#who').textContent=u?'الحساب غير مصرح له':'غير مسجل';return}$('#login').style.display='none';$('#dashboard').style.display='block';$('#who').textContent=u.email;const {data:ps,error:pe}=await sb.from('products').select('*').order('sort_order');if(pe){msg('تعذر تحميل المنتجات');return}$('#products').innerHTML=ps.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="muted">${p.amount} Robux</div><input id="price-${p.id}" type="number" min="0" step="0.01" value="${Number(p.price)}"><button class="btn primary" data-save="${p.id}">حفظ السعر</button></div>`).join('');const {data:orders}=await sb.from('purchase_orders').select('*').order('created_at',{ascending:false});$('#orders').innerHTML=orders?.length?orders.map(o=>`<div class="row"><div><b>${esc(o.product_name)}</b><div class="muted">${esc(o.roblox_username)} · ${Number(o.total_amount).toFixed(2)} د.ل · ${new Date(o.created_at).toLocaleString('ar-LY')}</div></div><div>${o.status==='paid_pending_fulfillment'?`<button class="btn primary" data-complete="${o.id}">تم التنفيذ</button> <button class="btn soft" data-refund="${o.id}">إرجاع المبلغ</button>`:`<span class="muted">${esc(o.status)}</span>`}</div></div>`).join(''):'<div class="muted">ما فيش طلبات.</div>';const token=(await sb.auth.getSession()).data.session?.access_token;const r=await fetch(URL+'/functions/v1/admin-topup-review',{headers:{Authorization:'Bearer '+token}});const td=await r.json();const topups=td.requests||[];$('#topups').innerHTML=topups.length?topups.map(x=>`<div class="row"><div><b>${esc(x.method)} · ${Number(x.amount).toFixed(2)} د.ل</b><div class="muted">${esc(x.transfer_reference)} · ${esc(x.phone)}</div></div><div><button class="btn primary" data-topup="${x.id}" data-status="approved">اعتماد</button> <button class="btn soft" data-topup="${x.id}" data-status="rejected">رفض</button></div></div>`).join(''):'<div class="muted">ما فيش طلبات شحن معلقة.</div>'}catch(e){$('#who').textContent='تعذر التحقق من الاتصال';$('#login').style.display='block';$('#dashboard').style.display='none';msg('مشكلة اتصال: '+(e?.message||'أعد تحميل الصفحة وجرب مرة أخرى'))}}
document.addEventListener('click',async e=>{const save=e.target.closest('[data-save]');if(save){const id=save.dataset.save,price=Number($('#price-'+id).value);const {error}=await sb.from('products').update({price,updated_at:new Date().toISOString()}).eq('id',id);msg(error?'تعذر حفظ السعر':'تم حفظ السعر');return}const complete=e.target.closest('[data-complete]');if(complete){const {error}=await sb.from('purchase_orders').update({status:'completed',reviewed_at:new Date().toISOString()}).eq('id',complete.dataset.complete).eq('status','paid_pending_fulfillment');msg(error?'تعذر تحديث الطلب':'تم وضع الطلب كمكتمل');load();return}const refund=e.target.closest('[data-refund]');if(refund){const u=await user();const {error}=await sb.rpc('refund_purchase_order',{p_order_id:refund.dataset.refund,p_admin_email:u.email,p_admin_note:'إرجاع من لوحة الإدارة'});msg(error?'تعذر إرجاع المبلغ':'تم إرجاع المبلغ للمحفظة');load();return}const top=e.target.closest('[data-topup]');if(top){const token=(await sb.auth.getSession()).data.session?.access_token;const r=await fetch(URL+'/functions/v1/admin-topup-review',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({request_id:top.dataset.topup,status:top.dataset.status})});const d=await r.json();msg(d.error?'تعذر مراجعة الطلب':'تمت مراجعة طلب الشحن');load()}});$('#send').addEventListener('click',async()=>{const btn=$('#send'),email=ADMIN_EMAIL;btn.disabled=true;btn.textContent='جاري الإرسال…';msg('');try{const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:'https://hymozarog-jp.github.io/L1017n/admin.html'}});if(error){msg('فشل إرسال الرابط: '+error.message)}else{msg('تم طلب إرسال رابط الدخول إلى '+email+'؛ افحص البريد والرسائل غير المرغوب فيها.')}}catch(e){msg('صار خطأ في الاتصال: '+(e?.message||'حاول مرة ثانية'))}finally{btn.disabled=false;btn.textContent='إرسال رابط الدخول'}});$('#logout').onclick=async()=>{await sb.auth.signOut();load()};sb.auth.onAuthStateChange(()=>load());load().catch(e=>{document.querySelector('#who').textContent='تعذر التحقق: '+(e?.message||'خطأ غير معروف');document.querySelector('#login').style.display='block';document.querySelector('#dashboard').style.display='none';document.querySelector('#msg').textContent='حدّث الصفحة وحاول مرة أخرى.'});</script></body></html>
