<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L1017n | لوحة الإدارة</title><style>body{margin:0;background:#07110c;color:#eef8ef;font-family:Arial,sans-serif}.wrap{width:min(1100px,92%);margin:40px auto}.panel{background:#0d1b13;border:1px solid #ffffff14;border-radius:20px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.row{border:1px solid #ffffff12;border-radius:16px;padding:16px;background:#ffffff04}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-radius:0;border-width:0 0 1px}.input{width:100%;box-sizing:border-box;margin:10px 0;padding:11px;border-radius:10px;border:1px solid #ffffff16;background:#07110c;color:#fff}.btn{border:0;border-radius:12px;padding:11px 15px;cursor:pointer}.primary{background:#a8f36b;color:#08120e}.soft{background:#ffffff10;color:#fff}.muted{color:#91a397;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>لوحة إدارة L1017n</h1><div id="who" class="muted">لوحة الدخول جاهزة — أدخل كلمة المرور.</div><section id="login" class="panel"><h2>دخول الإدارة</h2><p class="muted">سجّل الدخول بحساب الإدارة وكلمة المرور. صلاحية الإدارة مرتبطة بحسابك.</p><input id="email" class="input" type="email" autocomplete="username" placeholder="البريد الإلكتروني" value="mommedmmkk@gamil.com"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="كلمة المرور"><button id="enter" class="btn primary">دخول</button></section><section id="dashboard" style="display:none"><div class="panel"><h2>باقات Roblox والأسعار</h2><div id="products" class="grid"></div></div><div class="panel"><h2>طلبات الشراء</h2><div id="orders"></div></div><div class="panel"><h2>طلبات شحن المحفظة</h2><div id="topups"></div></div><button id="logout" class="btn soft">تسجيل الخروج</button></section><p id="msg" class="muted"></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.getElementById('who').textContent='تعذر تحميل مكتبة تسجيل الدخول؛ جرّب فتح الصفحة على شبكة أخرى.'"></script><script>if(!window.supabase){document.getElementById("who").textContent="مكتبة تسجيل الدخول لم تتحمل. قد يكون CDN محجوباً؛ جرّب شبكة أخرى.";throw new Error("Supabase JS CDN unavailable")}const URL='https://cmtxsjlehjworqypbxjz.supabase.co',KEY='sb_publishable_NrahtO5qp8p4OgjODMbxdQ_XqbUWSAk',ADMIN_EMAIL='mommedmmkk@gamil.com',sb=supabase.createClient(URL,KEY),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=x=>$('#msg').textContent=x;async function withTimeout(p,ms,label){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(label+' — انتهت مهلة الاتصال')),ms))])}async function user(){const r=await withTimeout(sb.auth.getSession(),7000,'التحقق من الجلسة');return r.data.session?.user||null}async function load(){$('#login').style.display='block';$('#dashboard').style.display='none';$('#who').textContent='لوحة الدخول جاهزة';try{const u=await user();if(!u||u.email?.toLowerCase()!==ADMIN_EMAIL){$('#who').textContent=u?'الحساب غير مصرح له. استخدم حساب الإدارة.':'أدخل كلمة مرور حساب الإدارة لتسجيل الدخول.';return}$('#who').textContent='تم التحقق من حساب الإدارة: '+u.email;}catch(e){$('#who').textContent='تعذر التحقق تلقائياً؛ يمكنك تجربة تسجيل الدخول أدناه.';msg('الاتصال بـ Supabase تأخر. جرّب الدخول، وإذا استمرت المشكلة تحقق من الاتصال.')}}async function openDashboard(){msg('جارٍ تسجيل الدخول...');const email=$('#email').value.trim().toLowerCase(),password=$('#password').value;if(email!==ADMIN_EMAIL){msg('هذا البريد غير مصرح له بدخول الإدارة.');return}if(!password){msg('اكتب كلمة المرور أولاً.');return}let result;try{result=await withTimeout(sb.auth.signInWithPassword({email,password}),12000,'تسجيل الدخول')}catch(e){msg('تعذر الاتصال: '+e.message);return}const {data,error}=result;if(error){msg('تعذر الدخول: '+error.message);return}if(data.user?.email?.toLowerCase()!==ADMIN_EMAIL){await sb.auth.signOut();msg('الحساب غير مصرح له.');return}const {data:admin,error:adminError}=await sb.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(adminError||!admin){await sb.auth.signOut();msg('الحساب لا يملك صلاحية الإدارة.');return}$('#login').style.display='none';$('#dashboard').style.display='block';$('#who').textContent=ADMIN_EMAIL;await refreshDashboard()}async function refreshDashboard(){try{const {data:ps,error:pe}=await sb.from('products').select('*').order('sort_order');if(pe)throw pe;$('#products').innerHTML=(ps||[]).map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="muted">${p.amount} Robux</div><input class="input" id="p-${p.id}" type="number" min="0" step=".01" value="${Number(p.price)}"><button class="btn primary" data-save="${p.id}">حفظ السعر</button></div>`).join('');const {data:os,error:oe}=await sb.from('purchase_orders').select('*').order('created_at',{ascending:false});if(oe)throw oe;$('#orders').innerHTML=(os||[]).map(o=>`<div class="row"><div><b>${esc(o.product_name)}</b><div class="muted">${esc(o.roblox_username)} · ${Number(o.total_amount).toFixed(2)} د.ل</div></div>${o.status==='paid_pending_fulfillment'?`<div><button class="btn primary" data-complete="${o.id}">تم التنفيذ</button> <button class="btn soft" data-refund="${o.id}">إرجاع المبلغ</button></div>`:`<span class="muted">${esc(o.status)}</span>`}</div>`).join('')||'<div class="muted">ما فيش طلبات.</div>';const token=(await sb.auth.getSession()).data.session?.access_token;const r=await fetch(URL+'/functions/v1/admin-topup-review',{headers:{Authorization:'Bearer '+token}}),td=await r.json();$('#topups').innerHTML=(td.requests||[]).map(x=>`<div class="row"><div><b>${esc(x.method)} · ${Number(x.amount).toFixed(2)} د.ل</b><div class="muted">${esc(x.transfer_reference)} · ${esc(x.phone)}</div></div><div><button class="btn primary" data-topup="${x.id}" data-status="approved">اعتماد</button> <button class="btn soft" data-topup="${x.id}" data-status="rejected">رفض</button></div></div>`).join('')||'<div class="muted">ما فيش طلبات شحن معلقة.</div>'}catch(e){msg('مشكلة اتصال: '+(e?.message||'حاول مرة ثانية'))}}document.addEventListener('click',async e=>{let b=e.target.closest('[data-save]');if(b){const id=b.dataset.save,{error}=await sb.from('products').update({price:Number($('#p-'+id).value),updated_at:new Date().toISOString()}).eq('id',id);msg(error?'تعذر حفظ السعر':'تم حفظ السعر');return}b=e.target.closest('[data-complete]');if(b){const {error}=await sb.from('purchase_orders').update({status:'completed',reviewed_at:new Date().toISOString()}).eq('id',b.dataset.complete).eq('status','paid_pending_fulfillment');msg(error?'تعذر تحديث الطلب':'تم وضع الطلب كمكتمل');refreshDashboard();return}b=e.target.closest('[data-refund]');if(b){const u=await user(),{error}=await sb.rpc('refund_purchase_order',{p_order_id:b.dataset.refund,p_admin_email:u.email,p_admin_note:'إرجاع من لوحة الإدارة'});msg(error?'تعذر إرجاع المبلغ':'تم إرجاع المبلغ للمحفظة');refreshDashboard();return}b=e.target.closest('[data-topup]');if(b){const token=(await sb.auth.getSession()).data.session?.access_token,r=await fetch(URL+'/functions/v1/admin-topup-review',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({request_id:b.dataset.topup,status:b.dataset.status})}),d=await r.json();msg(d.error?'تعذر مراجعة الطلب':'تمت مراجعة طلب الشحن');refreshDashboard()}});$('#enter').onclick=openDashboard;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')openDashboard()});$('#logout').onclick=async()=>{await sb.auth.signOut();load()};$('#who').textContent='لوحة الدخول جاهزة';load();</script></body></html>
